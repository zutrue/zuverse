name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The unit tests need no ffmpeg, so the optional ffmpeg downloads are skipped.
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm test
